<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICH SZEŚĆU</title>
  <!-- Skrypt Supabase oraz Twój plik konfiguracyjny -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Times New Roman, Times, serif;
      padding: 20px;
      padding-bottom: 130px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%; max-width: 700px;
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 10;
    }

    .header-container { text-align: center; margin-bottom: 20px; width: 100%; }
    .site-title { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; }
    .gif-container { margin-bottom: 30px; }
    .gif-container img { width: 140px; height: auto; display: block; margin: 0 auto; }
    .menu-section { text-align: center; }
    .menu-title { margin-bottom: 15px; font-size: 16px; }
    .menu-list { list-style: none; display: inline-block; text-align: left; }
    .menu-list li { margin-bottom: 10px; font-size: 15px; }
    .menu-list a { color: #ffffff; text-decoration: underline; font-weight: bold; cursor: pointer; }

    footer.site-footer {
      border-top: 1px solid #222222;
      padding-top: 15px; margin-top: 20px;
      width: 100%; text-align: center;
      font-size: 17px; color: #ffffff;
    }

    .content-section {
      display: none !important;
      width: 100%;
      border-top: 1px solid #333333;
      padding-top: 30px; margin-top: 30px; margin-bottom: 40px;
    }
    .content-section.active { display: block !important; }

    .section-title { font-size: 24px; margin-bottom: 25px; text-transform: uppercase; text-align: center; }

    /* ============ KAFELKI ALBUMÓW ============ */
    .album {
      border: 1px solid #333333; background-color: #050505;
      padding: 20px; margin-bottom: 30px;
      text-decoration: none; color: inherit;
      display: block;
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .album:hover { background: #0f0f0f; border-color: #555; }
    .album-header { display: flex; gap: 20px; align-items: flex-start; }
    .album-cover {
      width: 150px; height: 150px;
      background-color: #111111; object-fit: cover;
      border: 1px solid #333333; flex-shrink: 0;
    }
    .album-info { flex: 1; min-width: 0; }
    .album-info h3 { font-size: 20px; margin-bottom: 5px; }
    .album-info p { color: #aaaaaa; font-size: 14px; }
    .album-authors {
      margin-top: 8px; font-size: 13px; color: #cccccc;
      font-style: italic; word-break: break-word;
    }
    .album-authors .label { color: #888; font-style: normal; }
    .album-hint { font-size: 12px; color: #666; margin-top: 10px; }
    .album:hover .album-hint { color: #aaa; }

    /* ============ WIDOK POJEDYNCZEGO ALBUMU ============ */
    #single-album-view { display: none; width: 100%; }
    #single-album-view.active { display: block; }

    .back {
      display: inline-block; color: #fff; text-decoration: none;
      font-size: 15px; margin-bottom: 25px; letter-spacing: 1px;
      border: 1px solid #333; padding: 8px 14px;
      cursor: pointer; background: transparent; font-family: inherit;
    }
    .back:hover { background: #111; border-color: #666; }

    .single-album-cover {
      display: block;
      width: min(540px, 100%);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #111;
      border: 1px solid #333;
      margin: 0 auto 20px auto;
    }

    .single-album-meta {
      text-align: center;
      margin-bottom: 30px;
    }
    .single-album-meta h1 {
      font-size: 28px; letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .single-album-meta p { color: #aaaaaa; font-size: 14px; }
    .single-album-meta .album-authors {
      margin-top: 10px; font-size: 13px;
      color: #cccccc; font-style: italic;
      word-break: break-word;
    }

    /* ============ TRACKLISTA ============ */
    .tracklist { list-style: none; border-top: 1px solid #222; }
    .track {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 8px; border-bottom: 1px solid #111;
      gap: 10px; transition: background 0.15s;
    }
    .track:hover { background: #0f0f0f; }
    .track.playing .track-title { color: #1db954; font-weight: bold; }
    .track.playing::before { content: "▶ "; color: #1db954; }

    .track-text { flex: 1; min-width: 0; cursor: pointer; }
    .track-title { font-size: 15px; display: block; }
    .track-author {
      font-size: 12px; color: #888; font-style: italic;
      display: block; margin-top: 2px;
    }
    
    .track-actions {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .dislike-btn {
      background: transparent; border: 1px solid #333; color: #aaa;
      padding: 4px 8px; cursor: pointer; font-size: 13px;
      font-family: inherit; transition: all 0.15s;
    }
    .dislike-btn:hover { border-color: #f66; color: #f66; background: #200; }
    .stats-info {
      font-size: 11px; color: #778899; text-align: right; min-width: 60px;
    }

    .track-duration {
      font-size: 13px; color: #888;
      font-variant-numeric: tabular-nums; flex-shrink: 0; cursor: pointer;
    }

    #opis p { font-size: 18px; color: #ffffff; text-align: center; }
    .error-msg { text-align: center; color: #f66; padding: 40px 0; }

    /* ============ TOP 10 LISTA ============ */
    .top-list { list-style: none; border-top: 1px solid #222; }
    .top-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 10px; border-bottom: 1px solid #111; font-size: 14px;
    }
    .top-item:hover { background: #0f0f0f; }

    /* ============ LATAJĄCE BAKTERIE ============ */
    #floating-layer {
      position: fixed; inset: 0; overflow: hidden;
      pointer-events: none; z-index: 1;
    }
    .floating-item {
      position: absolute; top: 0; left: 0;
      width: 160px; height: 160px; object-fit: contain;
      opacity: 0.75; will-change: transform; user-select: none;
      pointer-events: none;
    }

    /* ==================== PLAYER ==================== */
    #player {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0a0a0a; border-top: 1px solid #222;
      padding: 10px 15px; display: flex; align-items: center;
      gap: 15px; z-index: 500;
      font-family: Times New Roman, Times, serif;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }
    #player.hidden { display: none; }

    .player-left {
      display: flex; align-items: center; gap: 10px;
      flex: 0 0 auto; width: 220px; overflow: hidden;
    }
    .player-left img {
      width: 50px; height: 50px; object-fit: cover;
      background: #111; border: 1px solid #333; flex-shrink: 0;
    }
    .player-info { overflow: hidden; flex: 1; }
    .player-info .t {
      font-size: 14px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; color: #fff;
    }
    .player-info .a {
      font-size: 12px; color: #888; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    .player-center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 6px; min-width: 0;
    }
    .player-controls { display: flex; align-items: center; gap: 15px; }

    .player-btn {
      background: transparent; border: none; color: #fff;
      cursor: pointer; padding: 4px; display: flex;
      align-items: center; justify-content: center;
      transition: color 0.15s, transform 0.1s;
    }
    .player-btn:hover { color: #1db954; }
    .player-btn:active { transform: scale(0.9); }
    .player-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .player-btn.play-pause svg { width: 32px; height: 32px; }

    .player-progress {
      display: flex; align-items: center; gap: 10px;
      width: 100%; max-width: 500px;
    }
    .player-progress .time {
      font-size: 11px; color: #888;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0; min-width: 35px; text-align: center;
    }
    .seek-bar {
      flex: 1; height: 18px; display: flex;
      align-items: center; position: relative; cursor: pointer;
    }
    .seek-track {
      width: 100%; height: 4px; background: #333;
      position: relative; border-radius: 2px;
      transition: background 0.15s;
    }
    .seek-bar:hover .seek-track { background: #555; }
    .seek-fill {
      position: absolute; top: 0; left: 0;
      height: 100%; background: #fff; border-radius: 2px;
      width: 0%; pointer-events: none;
    }
    .seek-bar:hover .seek-fill { background: #1db954; }
    .seek-handle {
      position: absolute; top: 50%; left: 0%;
      width: 12px; height: 12px; background: #fff;
      border-radius: 50% !important;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.15s; pointer-events: none;
    }
    .seek-bar:hover .seek-handle { transform: translate(-50%, -50%) scale(1); }

    .player-right {
      display: flex; align-items: center; gap: 6px;
      flex: 0 0 auto; width: 150px;
    }
    .player-btn.vol-btn { padding: 2px; }
    .player-btn.vol-btn svg { width: 20px; height: 20px; }
    .volume-bar {
      flex: 1; height: 16px; display: flex;
      align-items: center; position: relative; cursor: pointer;
    }
    .volume-track {
      width: 100%; height: 4px; background: #333;
      position: relative; border-radius: 2px;
    }
    .volume-fill {
      position: absolute; top: 0; left: 0;
      height: 100%; background: #fff; border-radius: 2px; width: 100%; pointer-events: none;
    }
    .volume-handle {
      position: absolute; top: 50%; left: 100%;
      width: 12px; height: 12px; background: #fff;
      border-radius: 50% !important;
      transform: translate(-50%, -50%) scale(0); pointer-events: none;
    }
    .volume-bar:hover .volume-handle { transform: translate(-50%, -50%) scale(1); }

    @media (max-width: 700px) {
      .player-left { width: auto; min-width: 0; flex: 0 1 auto; max-width: 130px; }
      .player-left img { width: 160px; height: 160px; }
      .player-progress .time { display: none; }
      .player-right { display: none; }
      .album-cover { width: 110px; height: 110px; }
      .single-album-meta h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div id="floating-layer"></div>

  <main>
    <div class="header-container">
      <h1 class="site-title">ICH SZEŚĆU</h1>

      <div class="gif-container">
        <img src="SpiewajaceGetto.gif" alt="GIF">
      </div>

      <div class="menu-section">
        <div class="menu-title">Menu wygląda następująco:</div>
        <ul class="menu-list">
          <li><a onclick="showSection('dyskografia')">DYSKOGRAFIA</a> - nasze albumy i utwory do odsłuchu</li>
          <li><a onclick="showSection('top-dislikes')" onclick="loadTopDislikes()">TOP 10 DISLIKE</a> - najbardziej nielubiane utwory</li>
          <li><a onclick="showSection('opis')">OPIS</a> - krótka informacja o zespole</li>
        </ul>
      </div>

      <footer class="site-footer">© CWEL records</footer>
    </div>

    <section id="dyskografia" class="content-section">
      <h2 class="section-title">Dyskografia</h2>
      <div id="albums-container"></div>
    </section>

    <section id="top-dislikes" class="content-section">
      <h2 class="section-title">TOP 10 Dislike 👎</h2>
      <ul class="top-list" id="top-list-container">
        <li style="text-align:center; padding: 20px; color: #888;">Ładowanie rankingu...</li>
      </ul>
    </section>

    <section id="opis" class="content-section">
      <h2 class="section-title">Opis</h2>
      <p>jestesmy zjebami i chuj</p>
    </section>

    <!-- ===== WIDOK POJEDYNCZEGO ALBUMU ===== -->
    <section id="single-album-view">
      <button class="back" onclick="goBackToDiscography()">← Wróć do dyskografii</button>
      <div id="single-album-content"></div>
    </section>
  </main>

  <!-- ==================== PLAYER ==================== -->
  <div id="player" class="hidden">
    <div class="player-left">
      <img id="pl-cover" src="" alt="">
      <div class="player-info">
        <div class="t" id="pl-title">—</div>
        <div class="a" id="pl-album">—</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="player-btn" id="pl-prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="player-btn play-pause" id="pl-play"><svg id="pl-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="player-btn" id="pl-next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>

      <div class="player-progress">

          <div class="seek-track">
            <div class="seek-fill" id="pl-fill"></div>

          </div>
        </div>
        <div class="time" id="pl-duration">0:00</div>
      </div>
    </div>

    <div class="player-right">
      <button class="player-btn vol-btn" id="pl-mute"><svg id="pl-vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <div class="volume-bar" id="pl-volume">
        <div class="volume-track">
          <div class="volume-fill" id="pl-volume-fill"></div>
          <div class="volume-handle" id="pl-volume-handle"></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-el" preload="metadata"></audio>

  <script>
    let albumsData = [];
    let playlist = [];
    let currentIndex = -1;
    let trackStats = {}; // Przechowuje liczniki pobrane z bazy dla aktualnego albumu

    // Generuje unikalny i stabilny ID utworu na podstawie jego ścieżki w pliku src
    function getTrackId(src) {
      return btoa(unescape(encodeURIComponent(src))).replace(/[^a-zA-Z0-9]/g, '_');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function parseAuthorsList(authorStr) {
      if (!authorStr) return [];
      const parts = String(authorStr).split(',');
      const seen = new Map();
      parts.forEach(part => {
        const orig = part.trim();
        if (!orig) return;
        const key = orig.toLowerCase();
        if (!seen.has(key)) seen.set(key, orig);
      });
      return Array.from(seen.values());
    }

    function uniqueAuthors(tracks) {
      const seen = new Map();
      tracks.forEach(t => {
        parseAuthorsList(t.author).forEach(a => {
          const key = a.toLowerCase();
          if (!seen.has(key)) seen.set(key, a);
        });
      });
      return Array.from(seen.values());
    }

    function normalizeAuthorsString(authorStr) {
      return parseAuthorsList(authorStr).join(', ');
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // ==================== SUPABASE: STATYSTYKI =====================

    async function fetchAlbumStats(tracks) {
      trackStats = {};
      const ids = tracks.map(t => getTrackId(t.src));
      
      const { data, error } = await _supabase
        .from('utwory')
        .select('id, dislikes, views')
        .in('id', ids);

      if (!error && data) {
        data.forEach(row => {
          trackStats[row.id] = { dislikes: row.dislikes || 0, views: row.views || 0 };
        });
      }
    }

    async function registerView(trackSrc) {
      const trackId = getTrackId(trackSrc);
      const storageKey = `viewed_${trackId}`;
      if (localStorage.getItem(storageKey)) return;

      // Pobierz aktualny stan lub załóż 0
      let currentViews = (trackStats[trackId] && trackStats[trackId].views) || 0;
      let currentDislikes = (trackStats[trackId] && trackStats[trackId].dislikes) || 0;
      
      const newViews = currentViews + 1;
      if (!trackStats[trackId]) trackStats[trackId] = {};
      trackStats[trackId].views = newViews;

      // Aktualizuj w Supabase
      const { error } = await _supabase
        .from('utwory')
        .upsert({ id: trackId, views: newViews, dislikes: currentDislikes }, { onConflict: ['id'] });

      if (!error) {
        localStorage.setItem(storageKey, 'true');
        updateTrackUIStats(trackId);
      }
    }

    async function handleDislike(trackSrc, btnElement) {
      const trackId = getTrackId(trackSrc);
      const storageKey = `disliked_${trackId}`;
      
      if (localStorage.getItem(storageKey)) {
        alert("Już dałeś dislike temu utworowi!");
        return;
      }

      let currentDislikes = (trackStats[trackId] && trackStats[trackId].dislikes) || 0;
      let currentViews = (trackStats[trackId] && trackStats[trackId].views) || 0;

      const newDislikes = currentDislikes + 1;
      if (!trackStats[trackId]) trackStats[trackId] = {};
      trackStats[trackId].dislikes = newDislikes;

      const { error } = await _supabase
        .from('utwory')
        .upsert({ id: trackId, dislikes: newDislikes, views: currentViews }, { onConflict: ['id'] });

      if (!error) {
        localStorage.setItem(storageKey, 'true');
        updateTrackUIStats(trackId);
        btnElement.style.color = '#f66';
        btnElement.style.borderColor = '#f66';
      } else {
        alert("Wystąpił błąd podczas zapisywania dislika.");
      }
    }

    function updateTrackUIStats(trackId) {
      const statEl = document.getElementById(`stats_${trackId}`);
      if (statEl && trackStats[trackId]) {
        const d = trackStats[trackId].dislikes || 0;
        const v = trackStats[trackId].views || 0;
        statEl.textContent = `👎 ${d} | 👀 ${v}`;
      }
    }

    async function loadTopDislikes() {
      const container = document.getElementById('top-list-container');
      container.innerHTML = '<li style="text-align:center; padding: 20px; color: #888;">Ładowanie rankingu...</li>';

      const { data, error } = await _supabase
        .from('utwory')
        .select('*')
        .order('dislikes', { ascending: false })
        .limit(10);

      if (error || !data || data.length === 0) {
        container.innerHTML = '<li style="text-align:center; padding: 20px; color: #888;">Brak danych w rankingu.</li>';
        return;
      }

      // Znajdź nazwy utworów w lokalnym albumsData dopasowując po ID
      let html = '';
      data.forEach((row, index) => {
        let foundTitle = "Nieznany utwór";
        let foundAlbum = "";

        albumsData.forEach(album => {
          album.tracks.forEach(t => {
            if (getTrackId(t.src) === row.id) {
              foundTitle = t.title;
              foundAlbum = album.title;
            }
          });
        });

        html += `
          <li class="top-item">
            <div>
              <strong>#${index + 1}. ${escapeHtml(foundTitle)}</strong>
              ${foundAlbum ? `<div style="font-size:11px; color:#888;">Album: ${escapeHtml(foundAlbum)}</div>` : ''}
            </div>
            <div style="font-size: 13px; color: #f66;">
              👎 ${row.dislikes} dislików &nbsp;|&nbsp; 👀 ${row.views} wyświetleń
            </div>
          </li>
        `;
      });
      container.innerHTML = html;
    }

    // ==================== LATAJĄCE OBRAZKI =====================

    let floatingRafId = null;
    let floatingItems = [];

    function stopFloating() {
      if (floatingRafId) { cancelAnimationFrame(floatingRafId); floatingRafId = null; }
      floatingItems = [];
      const layer = document.getElementById('floating-layer');
      if (layer) layer.innerHTML = '';
    }

    function startFloating(imageSrc) {
      stopFloating();
      if (!imageSrc) return;
      const layer = document.getElementById('floating-layer');
      if (!layer) return;

      const isMobile = window.innerWidth <= 700;
      const COUNT = isMobile ? 8 : 12;
      const SIZE = 140;
      const SPEED_MIN = 0.4;
      const SPEED_MAX = 1.2;

      const W = () => window.innerWidth;
      const H = () => window.innerHeight;

      for (let i = 0; i < COUNT; i++) {
        const img = document.createElement('img');
        img.src = imageSrc;
        img.className = 'floating-item';
        img.draggable = false;

        const x = Math.random() * Math.max(1, W() - SIZE);
        const y = Math.random() * Math.max(1, H() - SIZE);
        const speed = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
        const angle = Math.random() * Math.PI * 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        img.style.transform = `translate(${x}px, ${y}px)`;
        layer.appendChild(img);
        floatingItems.push({ el: img, x, y, vx, vy, size: SIZE });
      }

      let lastTime = performance.now();
      function step(now) {
        const dt = Math.min((now - lastTime) / 16.67, 3);
        lastTime = now;
        const w = W(), h = H();

        floatingItems.forEach(it => {
          it.x += it.vx * dt;
          it.y += it.vy * dt;
          if (it.x <= 0) { it.x = 0; it.vx = Math.abs(it.vx); }
          else if (it.x + it.size >= w) { it.x = w - it.size; it.vx = -Math.abs(it.vx); }
          if (it.y <= 0) { it.y = 0; it.vy = Math.abs(it.vy); }
          else if (it.y + it.size >= h) { it.y = h - it.size; it.vy = -Math.abs(it.vy); }
          it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
        });
        floatingRafId = requestAnimationFrame(step);
      }
      floatingRafId = requestAnimationFrame(step);
    }

    // ===================== ROUTING =====================

    function getSlugFromURL() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('album') || '').trim();
    }

    function pushAlbumURL(slug) {
      const url = new URL(window.location.href);
      url.searchParams.set('album', slug);
      history.pushState({ slug }, '', url);
    }

    function clearAlbumURL() {
      const url = new URL(window.location.href);
      url.searchParams.delete('album');
      history.pushState({}, '', url);
    }

    window.addEventListener('popstate', () => {
      const slug = getSlugFromURL();
      if (slug) renderSingleAlbum(slug, false);
      else renderDiscographyView(false);
    });

    function hideAllSections() {
      document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    }

    function showSection(id) {
      stopFloating();
      document.getElementById('single-album-view').classList.remove('active');
      hideAllSections();
      const s = document.getElementById(id);
      if (s) s.classList.add('active');
      document.title = 'ICH SZEŚĆU';

      if (id === 'top-dislikes') {
        loadTopDislikes();
      }
    }

    function renderDiscographyView(push = true) {
      stopFloating();
      document.getElementById('single-album-view').classList.remove('active');
      hideAllSections();
      document.getElementById('dyskografia').classList.add('active');
      document.title = 'ICH SZEŚĆU';
      if (push) clearAlbumURL();
    }

    function openAlbum(slug) {
      pushAlbumURL(slug);
      renderSingleAlbum(slug, false);
    }

    function goBackToDiscography() {
      history.back();
    }

    // ===================== ŁADOWANIE ALBUMÓW =====================

    async function loadAlbums() {
      const container = document.getElementById('albums-container');
      try {
        const res = await fetch('albums.json?' + Date.now());
        if (!res.ok) throw new Error('Nie znaleziono albums.json');
        albumsData = await res.json();

        if (!albumsData.length) {
          container.innerHTML = '<p style="text-align:center; color:#888;">Brak albumów.</p>';
          return;
        }

        let html = '';
        albumsData.forEach(album => {
          const authors = uniqueAuthors(album.tracks);
          const slug = (album.slug || '').trim();
          const slugEscaped = slug.replace(/'/g, "\\'");
          html += `
            <div class="album" onclick="openAlbum('${slugEscaped}')">
              <div class="album-header">
                <img src="${encodeURI(album.cover)}" alt="Okładka" class="album-cover">
                <div class="album-info">
                  <h3>${escapeHtml(album.title)}</h3>
                  <p>Rok wydania: ${escapeHtml(album.year)}</p>
                  ${authors.length ? `<div class="album-authors"><span class="label">Autorzy:</span> ${escapeHtml(authors.join(', '))}</div>` : ''}
                  <div class="album-hint">→ Kliknij, aby zobaczyć utwory</div>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;

        const startSlug = getSlugFromURL();
        if (startSlug) {
          renderSingleAlbum(startSlug, false);
        } else {
          hideAllSections();
          document.getElementById('dyskografia').classList.add('active');
        }
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:#f66;">Błąd ładowania albumów: ' + escapeHtml(err.message) + '</p>';
      }
    }

    // ===================== WIDOK POJEDYNCZEGO ALBUMU =====================

    async function renderSingleAlbum(slug, push = true) {
      const view = document.getElementById('single-album-view');
      const content = document.getElementById('single-album-content');

      const album = albumsData.find(a => (a.slug || '').toLowerCase() === slug.toLowerCase());

      if (!album) {
        stopFloating();
        hideAllSections();
        view.classList.add('active');
        content.innerHTML = '<div class="error-msg">Nie znaleziono albumu o nazwie: ' + escapeHtml(slug) + '</div>';
        return;
      }

      // Pobierz statystyki z Supabase dla wszystkich utworów z tego albumu
      await fetchAlbumStats(album.tracks);

      playlist = album.tracks.map(t => ({
        title: t.title,
        author: normalizeAuthorsString(t.author),
        src: t.src,
        cover: album.cover,
        album: album.title,
      }));
      currentIndex = -1;

      const authors = uniqueAuthors(album.tracks);

      let tracksHtml = '';
      album.tracks.forEach((track, idx) => {
        const trackAuthor = normalizeAuthorsString(track.author);
        const trackId = getTrackId(track.src);
        const stats = trackStats[trackId] || { dislikes: 0, views: 0 };
        const isDisliked = localStorage.getItem(`disliked_${trackId}`);

        tracksHtml += `
          <li class="track" data-idx="${idx}">
            <div class="track-text" onclick="playTrack(${idx})">
              <span class="track-title">${escapeHtml(track.title)}</span>
              ${trackAuthor ? `<span class="track-author">${escapeHtml(trackAuthor)}</span>` : ''}
            </div>
            <div class="track-actions">
              <span class="stats-info" id="stats_${trackId}">👎 ${stats.dislikes} | 👀 ${stats.views}</span>
              <button class="dislike-btn" onclick="handleDislike('${track.src.replace(/'/g, "\\'")}', this)" style="${isDisliked ? 'color: #f66; border-color: #f66;' : ''}">👎</button>
              <span class="track-duration" data-src="${encodeURI(track.src)}" onclick="playTrack(${idx})">--:--</span>
            </div>
          </li>
        `;
      });

      content.innerHTML = `
        <img src="${encodeURI(album.cover)}" alt="Okładka" class="single-album-cover">
        <div class="single-album-meta">
          <h1>${escapeHtml(album.title)}</h1>
          <p>Rok wydania: ${escapeHtml(album.year)}</p>
          ${authors.length ? `<div class="album-authors"><span class="label">Autorzy:</span> ${escapeHtml(authors.join(', '))}</div>` : ''}
        </div>
        <ul class="tracklist">${tracksHtml}</ul>
      `;

      hideAllSections();
      view.classList.add('active');

      loadDurations();
      document.title = album.title + ' — ICH SZEŚĆU';

      if (album.bgImage && album.bgImage.trim()) {
        startFloating(album.bgImage.trim());
      } else {
        stopFloating();
      }

      if (push) pushAlbumURL(slug);
    }

    function loadDurations() {
      document.querySelectorAll('#single-album-view .track-duration').forEach(el => {
        const src = el.getAttribute('data-src');
        const tmp = document.createElement('audio');
        tmp.preload = 'metadata';
        tmp.src = src;
        tmp.addEventListener('loadedmetadata', () => {
          el.textContent = formatTime(tmp.duration);
        });
        tmp.addEventListener('error', () => { el.textContent = ''; });
      });
    }

    // ===================== PLAYER =====================

    const audio = document.getElementById('audio-el');
    const playerEl = document.getElementById('player');
    const plCover = document.getElementById('pl-cover');
    const plTitle = document.getElementById('pl-title');
    const plAlbum = document.getElementById('pl-album');
    const plPlay = document.getElementById('pl-play');
    const plPlayIcon = document.getElementById('pl-play-icon');
    const plPrev = document.getElementById('pl-prev');
    const plNext = document.getElementById('pl-next');
    const plCurrent = document.getElementById('pl-current');
    const plDuration = document.getElementById('pl-duration');
    const plSeek = document.getElementById('pl-seek');
    const plFill = document.getElementById('pl-fill');
    const plHandle = document.getElementById('pl-handle');
    const plMute = document.getElementById('pl-mute');
    const plVolIcon = document.getElementById('pl-vol-icon');
    const plVolume = document.getElementById('pl-volume');
    const plVolFill = document.getElementById('pl-volume-fill');
    const plVolHandle = document.getElementById('pl-volume-handle');

    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const item = playlist[index];

      audio.src = encodeURI(item.src);
      audio.play().catch(err => console.log('Play error:', err));

      // Zaliczenie wyświetlenia w Supabase po uruchomieniu utworu
      registerView(item.src);

      playerEl.classList.remove('hidden');
      plCover.src = encodeURI(item.cover);
      plTitle.textContent = item.title;
      plAlbum.textContent = item.author ? (item.author + ' • ' + item.album) : item.album;

      document.querySelectorAll('.track').forEach(t => t.classList.remove('playing'));
      const active = document.querySelector(`.track[data-idx="${index}"]`);
      if (active) active.classList.add('playing');

      updatePlayIcon(true);
    }

    function updatePlayIcon(isPlaying) {
      if (isPlaying) {
        plPlayIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      } else {
        plPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    plPlay.addEventListener('click', () => {
      if (currentIndex === -1) {
        if (playlist.length) playTrack(0);
        return;
      }
      if (audio.paused) audio.play();
      else audio.pause();
    });

    plPrev.addEventListener('click', () => {
      if (currentIndex > 0) playTrack(currentIndex - 1);
      else if (playlist.length) playTrack(playlist.length - 1);
    });

    plNext.addEventListener('click', () => {
      if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1);
      else playTrack(0);
    });

    audio.addEventListener('play', () => updatePlayIcon(true));
    audio.addEventListener('pause', () => updatePlayIcon(false));
    audio.addEventListener('ended', () => {
      if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1);
      else updatePlayIcon(false);
    });

    audio.addEventListener('loadedmetadata', () => {
      plDuration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      plFill.style.width = pct + '%';
      plHandle.style.left = pct + '%';
      plCurrent.textContent = formatTime(audio.currentTime);
    });

    let isSeeking = false;
    function seekTo(e) {
      if (!audio.duration) return;
      const rect = plSeek.getBoundingClientRect();
      const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const pct = x / rect.width;
      audio.currentTime = pct * audio.duration;
    }
    plSeek.addEventListener('mousedown', (e) => { isSeeking = true; seekTo(e); });
    document.addEventListener('mousemove', (e) => { if (isSeeking) seekTo(e); });
    document.addEventListener('mouseup', () => { isSeeking = false; });

    let volume = parseFloat(localStorage.getItem('playerVolume'));
    if (isNaN(volume)) volume = 1;
    let lastVolume = volume > 0 ? volume : 1;

    function applyVolume() {
      audio.volume = volume;
      plVolFill.style.width = (volume * 100) + '%';
      plVolHandle.style.left = (volume * 100) + '%';
      localStorage.setItem('playerVolume', volume);
    }

    let isVolDragging = false;
    function setVolumeFromEvent(e) {
      const rect = plVolume.getBoundingClientRect();
      const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      volume = x / rect.width;
      if (volume > 0) lastVolume = volume;
      applyVolume();
    }
    plVolume.addEventListener('mousedown', (e) => { isVolDragging = true; setVolumeFromEvent(e); });
    document.addEventListener('mousemove', (e) => { if (isVolDragging) setVolumeFromEvent(e); });
    document.addEventListener('mouseup', () => { isVolDragging = false; });

    plMute.addEventListener('click', () => {
      volume = volume > 0 ? 0 : (lastVolume || 1);
      applyVolume();
    });

    applyVolume();

    window.addEventListener('DOMContentLoaded', async () => {
      await loadAlbums();
    });
  </script>

</body>
</html>
